<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let c"> {{ c.id }} </td>
  </ng-container>

  <!-- Nom -->
  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef> Nom </th>
    <td mat-cell *matCellDef="let c"> {{ c.nom }} </td>
  </ng-container>

  <!-- Prénom -->
  <ng-container matColumnDef="prenom">
    <th mat-header-cell *matHeaderCellDef> Prénom </th>
    <td mat-cell *matCellDef="let c"> {{ c.prenom }} </td>
  </ng-container>

  <!-- Email -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let c"> {{ c.email }} </td>
  </ng-container>

  <!-- Téléphone -->
  <ng-container matColumnDef="telephone">
    <th mat-header-cell *matHeaderCellDef> Téléphone </th>
    <td mat-cell *matCellDef="let c"> {{ c.telephone }} </td>
  </ng-container>

  <!-- Adresse -->
  <ng-container matColumnDef="adresse">
    <th mat-header-cell *matHeaderCellDef> Adresse </th>
    <td mat-cell *matCellDef="let c"> {{ c.adresse }} </td>
  </ng-container>

  <!-- Date création -->
  <ng-container matColumnDef="dateCreation">
    <th mat-header-cell *matHeaderCellDef> Créé le </th>
    <td mat-cell *matCellDef="let c"> {{ c.dateCreation | date }} </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let c" class="actions-cell">
      <button (click)="editClient(c)" class="text-blue-500 hover:text-blue-700 cursor-pointer" title="Modifier">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
        </svg>
      </button>
      <button (click)="deleteClient(c)" class="text-red-500 hover:text-red-700 cursor-pointer" title="Supprimer">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
      </button>
    </td>
  </ng-container>

  <!-- Header -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <!-- Rows -->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<app-client-edit-form
  *ngIf="selectedClient"
  [client]="selectedClient"
  [isLoading]="isLoading"
  (save)="saveEdit(selectedClient.id, $event)"
  (cancel)="cancelEdit()"
  class="mt-4"
></app-client-edit-form>
