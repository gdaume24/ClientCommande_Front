<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let c"> {{ c.id }} </td>
  </ng-container>

  <!-- N° Commande -->
  <ng-container matColumnDef="numeroCommande">
    <th mat-header-cell *matHeaderCellDef> N° Commande </th>
    <td mat-cell *matCellDef="let c"> {{ c.numeroCommande }} </td>
  </ng-container>

  <!-- Client -->
  <ng-container matColumnDef="client">
    <th mat-header-cell *matHeaderCellDef> Client </th>
    <td mat-cell *matCellDef="let c"> 
      <span>{{ c.clientId }}</span>
      <span *ngIf="!c.clientId" class="text-gray-400">-</span>
    </td>
  </ng-container>

  <!-- Montant -->
  <ng-container matColumnDef="montantTotal">
    <th mat-header-cell *matHeaderCellDef> Montant </th>
    <td mat-cell *matCellDef="let c"> {{ c.montantTotal | currency:'EUR':'symbol':'1.2-2' }} </td>
  </ng-container>

  <!-- Statut -->
  <ng-container matColumnDef="statut">
    <th mat-header-cell *matHeaderCellDef> Statut </th>
    <td mat-cell *matCellDef="let c">
      <span [ngClass]="{'bg-green-100 text-green-800': c.statut === 'Payée', 'bg-blue-100 text-blue-800': c.statut === 'En cours', 'bg-red-100 text-red-800': c.statut === 'Annulée'}" class="inline-block px-3 py-1 rounded text-sm">
        {{ c.statut }}
      </span>
    </td>
  </ng-container>

  <!-- Date création -->
  <ng-container matColumnDef="dateCreation">
    <th mat-header-cell *matHeaderCellDef> Créée le </th>
    <td mat-cell *matCellDef="let c"> {{ c.dateCommande | date }} </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let c" class="text-center flex gap-3">
      <button (click)="editCommande(c)" class="text-blue-500 hover:text-blue-700 cursor-pointer" title="Modifier">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
        </svg>
      </button>
      <button (click)="deleteCommande(c)" class="text-red-500 hover:text-red-700 cursor-pointer" title="Supprimer">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
      </button>
    </td>
  </ng-container>

  <!-- Header -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <!-- Rows -->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<app-commande-edit-form
  *ngIf="selectedCommande"
  [commande]="selectedCommande"
  [isLoading]="isLoading"
  (save)="selectedCommande && saveEdit(selectedCommande.id, $event)"
  (cancel)="cancelEdit()"
  class="mt-4"
></app-commande-edit-form>
