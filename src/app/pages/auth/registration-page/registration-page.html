<mat-card>
  <mat-card-header>
    <h2>Login Form</h2>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="registrationForm">
      <mat-form-field>
        <mat-label>Username</mat-label>
        <input 
          matInput 
          placeholder="Username" 
          name="username" 
          required
          formControlName="username"
        >
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input 
          matInput 
          placeholder="Email" 
          name="email" 
          required
          formControlName="email"
        >
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input 
          type="password" 
          matInput 
          placeholder="Password" 
          name="password" 
          required
          formControlName="password"
        >        
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
      <button 
      mat-raised-button 
      (click)="onRegistration()" 
      color="primary" 
      [disabled]="!registrationForm.valid"
      >Login</button>
    </form>
    <a class="connection-link" routerLink="/login">Page de connection</a>

  </mat-card-content>
</mat-card>
