<mat-card>
  <mat-card-header>
    <h2>Login Form</h2>
  </mat-card-header>
  <mat-card-content>
    <form>
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input 
          matInput 
          placeholder="Email" 
          name="email" 
          required
          [(ngModel)]="email"
        >
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input 
          type="password" 
          matInput 
          placeholder="Password" 
          name="password" 
          required
          [(ngModel)]="password"
        >        
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
      <button mat-raised-button (click)="onLogin()" color="primary" >Login</button>
    </form>
    <a class="register-link" routerLink="/register">S'enregistrer</a>

  </mat-card-content>
</mat-card>
